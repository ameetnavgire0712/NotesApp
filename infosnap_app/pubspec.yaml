name: infosnap_app
description: infoSnap.ai - Save anything, Find instantly. Your AI-powered personal knowledge assistant.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.2.4
  lottie: ^3.3.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^13.0.1
  
  # Networking
  dio: ^5.4.0
  http: ^1.2.0
  
  # Authentication
  supabase_flutter: ^2.3.0
  flutter_secure_storage: ^9.0.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # File Handling
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  mime: ^1.0.5
  receive_sharing_intent: ^1.8.1
  
  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.4
  share_plus: ^7.2.2
  permission_handler: ^11.2.0
  
  # Animations
  flutter_animate: ^4.5.2
  animations: ^2.0.11
  
  # Markdown (for note display)
  flutter_markdown: ^0.6.18+2
  app_links: ^6.4.1

  # Masonry / bento grid for My Snaps
  flutter_staggered_grid_view: ^0.7.0
  
  # In-app WebView (for original content reader)
  webview_flutter: ^4.4.0
  flutter_pdfview: ^1.3.2
  connectivity_plus: ^7.1.0
  
  # WebView OAuth (keeps app in foreground, avoids network stack issues)
  flutter_web_auth_2: ^4.0.0
  crypto: ^3.0.7
  cronet_http: ^1.8.0
  google_sign_in: ^7.2.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# Patched copy of receive_sharing_intent 1.8.1 that tolerates a null `type`
# value in the shared-intent payload. Reddit (and a few other Android apps)
# omit `type` from their ACTION_SEND intent, which makes the upstream package
# throw "type property cannot be null" before our share handler ever runs.
# See: https://github.com/KasemJaffer/receive_sharing_intent/issues/360
dependency_overrides:
  receive_sharing_intent:
    path: third_party/receive_sharing_intent

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icon_background.png
    - assets/icon_foreground.png
    - assets/help/
