<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotesApp Log Viewer</title>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: #00d9ff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search-box input {
            flex: 1;
            min-width: 300px;
            padding: 12px 16px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #16213e;
            color: #fff;
            font-size: 16px;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #00d9ff;
        }
        
        .search-box button {
            padding: 12px 24px;
            background: #00d9ff;
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .search-box button:hover {
            background: #00b8d4;
        }
        
        .search-box select {
            padding: 12px 16px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #16213e;
            color: #fff;
            font-size: 14px;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            cursor: pointer;
        }
        
        .checkbox-label input {
            width: 18px;
            height: 18px;
        }
        
        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .summary-card {
            background: #16213e;
            padding: 15px 25px;
            border-radius: 8px;
            border-left: 4px solid #00d9ff;
        }
        
        .summary-card.error {
            border-left-color: #ff4757;
        }
        
        .summary-card.warning {
            border-left-color: #ffa502;
        }
        
        .summary-card.debug {
            border-left-color: #747d8c;
        }
        
        .summary-card h3 {
            font-size: 24px;
            color: #fff;
        }
        
        .summary-card p {
            color: #aaa;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        .log-container {
            background: #0f0f23;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .log-header {
            background: #16213e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        
        .log-header h2 {
            color: #00d9ff;
            font-size: 16px;
        }
        
        .log-list {
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .log-entry {
            padding: 10px 20px;
            border-bottom: 1px solid #1a1a2e;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.5;
            display: grid;
            grid-template-columns: 180px 60px 1fr;
            gap: 15px;
            align-items: start;
        }
        
        .log-entry:hover {
            background: #16213e;
        }
        
        .log-entry.DEBUG { border-left: 3px solid #747d8c; }
        .log-entry.INFO { border-left: 3px solid #00d9ff; }
        .log-entry.WARNING { border-left: 3px solid #ffa502; }
        .log-entry.ERROR { border-left: 3px solid #ff4757; }
        
        .log-timestamp {
            color: #747d8c;
            white-space: nowrap;
        }
        
        .log-level {
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            text-align: center;
            font-size: 11px;
        }
        
        .log-level.DEBUG { background: #2d3436; color: #b2bec3; }
        .log-level.INFO { background: #0984e3; color: #fff; }
        .log-level.WARNING { background: #fdcb6e; color: #2d3436; }
        .log-level.ERROR { background: #d63031; color: #fff; }
        
        .log-content {
            color: #ddd;
            word-break: break-word;
        }
        
        .log-meta {
            color: #636e72;
            font-size: 11px;
            margin-top: 4px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #747d8c;
        }
        
        .spinner {
            border: 4px solid #16213e;
            border-top: 4px solid #00d9ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #2d1f1f;
            border: 1px solid #ff4757;
            color: #ff6b6b;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .no-results {
            text-align: center;
            padding: 50px;
            color: #747d8c;
        }
        
        .filter-buttons {
            display: flex;
            gap: 5px;
        }
        
        .filter-btn {
            padding: 5px 12px;
            border: 1px solid #333;
            background: transparent;
            color: #aaa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .filter-btn.active {
            background: #00d9ff;
            color: #1a1a2e;
            border-color: #00d9ff;
        }
        
        .filter-btn:hover:not(.active) {
            border-color: #00d9ff;
            color: #00d9ff;
        }
        
        .highlight {
            background: #ffa502;
            color: #1a1a2e;
            padding: 0 2px;
            border-radius: 2px;
        }

        .context-marker {
            background: #2d3436;
            color: #b2bec3;
            font-style: italic;
            border-left-color: #636e72 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 NotesApp Log Viewer</h1>
        
        <div class="search-box">
            <input type="text" id="correlationId" placeholder="Enter Correlation ID (e.g., 2649b4d0-c40d-4ab1-ac04-928fe1cf5969)" />
            <label class="checkbox-label">
                <input type="checkbox" id="includeContext" checked />
                Include Auth Context
            </label>
            <select id="levelFilter">
                <option value="">All Levels</option>
                <option value="DEBUG">DEBUG</option>
                <option value="INFO">INFO</option>
                <option value="WARNING">WARNING</option>
                <option value="ERROR">ERROR</option>
            </select>
            <button onclick="loadLogs()">🔍 Load Logs</button>
        </div>
        
        <div id="summary" class="summary" style="display: none;"></div>
        
        <div id="logContainer" class="log-container" style="display: none;">
            <div class="log-header">
                <h2 id="logTitle">Log Entries</h2>
                <div class="filter-buttons" id="filterButtons"></div>
            </div>
            <div class="log-list" id="logList"></div>
        </div>
        
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading logs...</p>
        </div>
        
        <div id="error" class="error-message" style="display: none;"></div>
        
        <div id="noResults" class="no-results" style="display: none;">
            <p>No logs found for this correlation ID.</p>
            <p>Make sure the ID is correct and the logs are still in the current log file.</p>
        </div>
    </div>

    <script>
        // Get correlation_id from URL if present
        const urlParams = new URLSearchParams(window.location.search);
        const correlationIdFromUrl = urlParams.get('correlation_id') || urlParams.get('id');
        if (correlationIdFromUrl) {
            document.getElementById('correlationId').value = correlationIdFromUrl;
            // Auto-load on page load if ID is in URL
            window.addEventListener('DOMContentLoaded', loadLogs);
        }

        async function loadLogs() {
            const correlationId = document.getElementById('correlationId').value.trim();
            const includeContext = document.getElementById('includeContext').checked;
            const levelFilter = document.getElementById('levelFilter').value;
            
            if (!correlationId) {
                alert('Please enter a Correlation ID');
                return;
            }
            
            // Show loading, hide others
            document.getElementById('loading').style.display = 'block';
            document.getElementById('logContainer').style.display = 'none';
            document.getElementById('summary').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('noResults').style.display = 'none';
            
            try {
                let url = AppConfig.logsTraceUrl(correlationId) + `?include_context=${includeContext}`;
                if (levelFilter) {
                    url += `&level=${levelFilter}`;
                }
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.logs || data.logs.length === 0) {
                    document.getElementById('noResults').style.display = 'block';
                    return;
                }
                
                renderSummary(data);
                renderLogs(data);
                
                // Update URL for sharing
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('correlation_id', correlationId);
                window.history.replaceState({}, '', newUrl);
                
            } catch (err) {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = `Error: ${err.message}`;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function renderSummary(data) {
            const summary = document.getElementById('summary');
            
            const levels = data.levels_summary || {};
            const totalLogs = data.total_lines;
            const duration = data.duration_ms;
            
            let html = `
                <div class="summary-card">
                    <h3>${totalLogs}</h3>
                    <p>Total Log Lines</p>
                </div>
            `;
            
            if (duration !== null) {
                html += `
                    <div class="summary-card">
                        <h3>${duration}ms</h3>
                        <p>Request Duration</p>
                    </div>
                `;
            }
            
            if (levels.DEBUG) {
                html += `
                    <div class="summary-card debug">
                        <h3>${levels.DEBUG}</h3>
                        <p>DEBUG</p>
                    </div>
                `;
            }
            
            if (levels.INFO) {
                html += `
                    <div class="summary-card">
                        <h3>${levels.INFO}</h3>
                        <p>INFO</p>
                    </div>
                `;
            }
            
            if (levels.WARNING) {
                html += `
                    <div class="summary-card warning">
                        <h3>${levels.WARNING}</h3>
                        <p>WARNING</p>
                    </div>
                `;
            }
            
            if (levels.ERROR) {
                html += `
                    <div class="summary-card error">
                        <h3>${levels.ERROR}</h3>
                        <p>ERROR</p>
                    </div>
                `;
            }
            
            summary.innerHTML = html;
            summary.style.display = 'flex';
        }
        
        function renderLogs(data) {
            const logList = document.getElementById('logList');
            const logContainer = document.getElementById('logContainer');
            const logTitle = document.getElementById('logTitle');
            
            logTitle.textContent = `Log Entries for ${data.correlation_id}`;
            
            let html = '';
            for (const log of data.logs) {
                const isContext = log.correlation_id === 'system';
                const contextClass = isContext ? 'context-marker' : '';
                
                html += `
                    <div class="log-entry ${log.level} ${contextClass}">
                        <span class="log-timestamp">${log.timestamp}</span>
                        <span class="log-level ${log.level}">${log.level}</span>
                        <div class="log-content">
                            ${escapeHtml(log.message)}
                            <div class="log-meta">${log.module} → ${log.function}() | Line ${log.line_number}</div>
                        </div>
                    </div>
                `;
            }
            
            logList.innerHTML = html;
            logContainer.style.display = 'block';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Enter key to search
        document.getElementById('correlationId').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadLogs();
            }
        });
    </script>
</body>
</html>
