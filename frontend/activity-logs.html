<!DOCTYPE html>
<!-- Deploy v18: 2025-02-13T18:25 - Fixed auth in timing bar + correct network latency calculation -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotesApp Activity Logs Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 320px;
            background: #161b22;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #30363d;
        }
        
        .sidebar-header h1 {
            color: #58a6ff;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .sidebar-header h1::before {
            content: "📋";
        }
        
        /* User selector */
        .user-selector {
            margin-bottom: 15px;
        }
        
        .user-selector label {
            display: block;
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .user-selector select {
            width: 100%;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 13px;
            cursor: pointer;
        }
        
        .user-selector select:focus {
            border-color: #58a6ff;
            outline: none;
        }
        
        /* Time range */
        .time-range {
            display: flex;
            gap: 8px;
        }
        
        .time-range button {
            flex: 1;
            padding: 8px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #8b949e;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .time-range button:hover {
            background: #30363d;
            color: #c9d1d9;
        }
        
        .time-range button.active {
            background: #238636;
            border-color: #238636;
            color: #fff;
        }
        
        /* Activity list */
        .activity-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .activity-item {
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .activity-item:hover {
            border-color: #58a6ff;
            background: #161b22;
        }
        
        .activity-item.selected {
            border-color: #58a6ff;
            background: #1f2937;
            box-shadow: 0 0 0 1px #58a6ff;
        }
        
        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        
        .activity-action {
            font-weight: 600;
            color: #c9d1d9;
            font-size: 13px;
        }
        
        .activity-status {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .activity-status.success {
            background: rgba(35, 134, 54, 0.2);
            color: #3fb950;
        }
        
        .activity-status.error {
            background: rgba(248, 81, 73, 0.2);
            color: #f85149;
        }
        
        .activity-status.warning {
            background: rgba(240, 136, 62, 0.2);
            color: #f0883e;
        }
        
        .activity-status.pending {
            background: rgba(187, 128, 9, 0.2);
            color: #d29922;
        }
        
        .activity-meta {
            font-size: 12px;
            color: #8b949e;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .activity-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .activity-query {
            margin-top: 8px;
            padding: 6px 10px;
            background: #21262d;
            border-radius: 4px;
            font-size: 12px;
            color: #58a6ff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Main content area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .content-header {
            padding: 20px;
            border-bottom: 1px solid #30363d;
            background: #161b22;
        }
        
        .content-header h2 {
            color: #c9d1d9;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .content-header .correlation-id {
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 13px;
            color: #8b949e;
            background: #0d1117;
            padding: 6px 12px;
            border-radius: 6px;
            display: inline-block;
        }
        
        .content-header .summary {
            margin-top: 12px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .summary-item {
            background: #21262d;
            padding: 10px 16px;
            border-radius: 6px;
            text-align: center;
        }
        
        .summary-item .value {
            font-size: 20px;
            font-weight: 600;
            color: #58a6ff;
        }
        
        .summary-item .label {
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
            margin-top: 4px;
        }
        
        /* Log entries */
        .log-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .log-entry {
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 4px;
            border-left: 3px solid transparent;
            background: #161b22;
        }
        
        .log-entry.DEBUG {
            border-left-color: #8b949e;
            color: #8b949e;
        }
        
        .log-entry.INFO {
            border-left-color: #58a6ff;
            color: #c9d1d9;
        }
        
        .log-entry.WARNING {
            border-left-color: #d29922;
            color: #d29922;
        }
        
        .log-entry.ERROR {
            border-left-color: #f85149;
            color: #f85149;
            background: rgba(248, 81, 73, 0.1);
        }
        
        .log-timestamp {
            color: #6e7681;
            margin-right: 8px;
        }
        
        .log-level {
            font-weight: 600;
            margin-right: 8px;
            min-width: 60px;
            display: inline-block;
        }
        
        .log-logger {
            color: #7ee787;
            margin-right: 8px;
        }
        
        .log-message {
            word-break: break-word;
        }
        
        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #8b949e;
            text-align: center;
            padding: 40px;
        }
        
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .empty-state p {
            margin-top: 8px;
            font-size: 14px;
        }
        
        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #8b949e;
        }
        
        .loading::before {
            content: "";
            width: 20px;
            height: 20px;
            border: 2px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Error state */
        .error-message {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid #f85149;
            border-radius: 6px;
            padding: 12px 16px;
            color: #f85149;
            margin: 10px;
        }
        
        /* Stats bar */
        .stats-bar {
            padding: 12px 20px;
            background: #21262d;
            border-bottom: 1px solid #30363d;
            display: flex;
            gap: 24px;
            font-size: 13px;
        }
        
        .stats-bar .stat {
            color: #8b949e;
        }
        
        .stats-bar .stat strong {
            color: #c9d1d9;
            margin-left: 4px;
        }

        /* Refresh button */
        .refresh-btn {
            padding: 8px 16px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
        }
        
        .refresh-btn:hover {
            background: #30363d;
        }
        
        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Tab navigation for log views */
        .log-tabs {
            display: flex;
            gap: 4px;
            padding: 12px 20px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }
        
        .log-tab {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: #8b949e;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .log-tab:hover {
            color: #c9d1d9;
            background: #21262d;
        }
        
        .log-tab.active {
            background: #238636;
            color: #fff;
            border-color: #238636;
        }
        
        /* JSON viewer */
        .json-viewer {
            background: #0d1117;
            border-radius: 6px;
            padding: 16px;
            margin: 10px 0;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .json-key {
            color: #79c0ff;
        }
        
        .json-string {
            color: #a5d6ff;
        }
        
        .json-number {
            color: #79c0ff;
        }
        
        .json-boolean {
            color: #ff7b72;
        }
        
        .json-null {
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar with user selection and activity list -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>Activity Logs</h1>
                
                <div class="user-selector">
                    <label>Select User</label>
                    <select id="userSelect">
                        <option value="">Loading users...</option>
                    </select>
                </div>
                
                <div class="time-range">
                    <button data-hours="1">1h</button>
                    <button data-hours="6">6h</button>
                    <button data-hours="24" class="active">24h</button>
                    <button data-hours="168">7d</button>
                </div>
                
                <button class="refresh-btn" id="refreshBtn">
                    🔄 Refresh
                </button>
            </div>
            
            <div class="activity-list" id="activityList">
                <div class="empty-state">
                    <div class="icon">👤</div>
                    <p>Select a user to view their activities</p>
                </div>
            </div>
        </div>
        
        <!-- Main content area for detailed logs -->
        <div class="main-content">
            <div class="content-header" id="contentHeader" style="display: none;">
                <h2 id="activityTitle">Activity Details</h2>
                <div class="correlation-id" id="correlationId"></div>
                <div class="summary" id="activitySummary"></div>
            </div>
            
            <div class="log-tabs" id="logTabs" style="display: none;">
                <button class="log-tab active" data-view="metadata">📋 Details</button>
                <button class="log-tab" data-view="trace">🔬 Search Trace</button>
                <button class="log-tab" data-view="upload-trace">📤 Upload Trace</button>
                <button class="log-tab" data-view="operations">⚙️ Operations</button>
                <button class="log-tab" data-view="file">📄 Server Logs</button>
                <button class="log-tab" data-view="raw">📝 Raw JSON</button>
            </div>
            
            <div class="log-container" id="logContainer">
                <div class="empty-state">
                    <div class="icon">📋</div>
                    <p>Click on an activity to see detailed logs</p>
                    <p style="color: #6e7681; font-size: 12px; margin-top: 12px;">
                        Logs include: embedding generation, vector search scores,<br>
                        keyword matching, reranking, and filtering decisions
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // State
        let currentUserId = null;
        let currentHours = 24;
        let currentCorrelationId = null;
        let currentActivity = null;
        let currentView = 'metadata';
        let activities = [];
        
        // API base URL - always go direct to Fly.io for logs (has CORS enabled)
        const API_BASE = 'https://notesapp-vector-search.monocle0712.workers.dev';
        
        // Auth token from Supabase session
        let accessToken = null;
        
        // Get access token from localStorage (set by auth.js)
        function getAccessToken() {
            if (!accessToken) {
                accessToken = localStorage.getItem('access_token');
            }
            return accessToken;
        }
        
        // Get auth headers for API calls
        function getAuthHeaders() {
            const token = getAccessToken();
            if (token) {
                return { 'Authorization': `Bearer ${token}` };
            }
            return {};
        }
        
        // Check if user is logged in
        async function checkAuth() {
            const token = getAccessToken();
            if (!token) {
                // Redirect to login
                window.location.href = 'index.html?redirect=' + encodeURIComponent(window.location.pathname);
                return false;
            }
            return true;
        }
        
        // Debug: log errors to the page
        window.onerror = function(msg, url, line) {
            console.error('JS Error:', msg, url, line);
            const list = document.getElementById('activityList');
            if (list) {
                list.innerHTML = `<div class="error-message">JS Error: ${msg}<br>at line ${line}</div>`;
            }
        };
        
        // Catch unhandled promise rejections (fetch failures in async functions)
        window.addEventListener('unhandledrejection', function(event) {
            console.error('Unhandled rejection:', event.reason);
            const list = document.getElementById('activityList');
            if (list) {
                list.innerHTML = `<div class="error-message">Async Error: ${event.reason?.message || event.reason}</div>`;
            }
            const select = document.getElementById('userSelect');
            if (select && select.options[0]?.text === 'Loading...') {
                select.innerHTML = `<option value="">Error: ${event.reason?.message || 'Unknown error'}</option>`;
            }
        });
        
        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('[ActivityLogs] DOMContentLoaded fired');
            
            // Check auth before loading data
            const isAuthed = await checkAuth();
            if (!isAuthed) return;
            
            loadUsers();
            setupEventListeners();
        });
        
        function setupEventListeners() {
            // User selection
            document.getElementById('userSelect').addEventListener('change', (e) => {
                currentUserId = e.target.value;
                if (currentUserId) {
                    loadActivities();
                }
            });
            
            // Time range buttons
            document.querySelectorAll('.time-range button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.time-range button').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentHours = parseInt(e.target.dataset.hours);
                    if (currentUserId) {
                        loadActivities();
                    }
                });
            });
            
            // Refresh button
            document.getElementById('refreshBtn').addEventListener('click', () => {
                if (currentUserId) {
                    loadActivities();
                } else {
                    loadUsers();
                }
            });
            
            // Log view tabs
            document.querySelectorAll('.log-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    document.querySelectorAll('.log-tab').forEach(t => t.classList.remove('active'));
                    e.target.classList.add('active');
                    currentView = e.target.dataset.view;
                    renderCurrentView();
                });
            });
        }
        
        async function loadUsers() {
            const select = document.getElementById('userSelect');
            select.innerHTML = '<option value="">Loading...</option>';
            
            // Always fetch users with a large time range (30 days) — users don't change often
            // The time filter only limits activities, not the user dropdown
            const userHours = Math.max(currentHours, 720);
            const url = `${API_BASE}/api/v1/logs/dashboard/users?hours=${userHours}`;
            console.log('Fetching users from:', url);
            
            try {
                console.log('[loadUsers] Starting fetch...');
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 15000); // 15s timeout
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: getAuthHeaders(),
                    signal: controller.signal
                });
                clearTimeout(timeout);
                
                console.log('[loadUsers] Response status:', response.status);
                
                if (!response.ok) {
                    const text = await response.text();
                    console.error('[loadUsers] Response body:', text);
                    throw new Error(`HTTP ${response.status}: ${text}`);
                }
                
                const data = await response.json();
                console.log('[loadUsers] Users data:', JSON.stringify(data).substring(0, 200));
                
                if (!data.users || data.users.length === 0) {
                    select.innerHTML = '<option value="">No users found</option>';
                    return;
                }
                
                select.innerHTML = '<option value="">Select a user...</option>';
                data.users.forEach(user => {
                    const option = document.createElement('option');
                    option.value = user.user_id;
                    option.textContent = `${user.user_id.substring(0, 8)}... (${user.activity_count} activities)`;
                    select.appendChild(option);
                });
                
                // If only one user, auto-select
                if (data.users.length === 1) {
                    select.value = data.users[0].user_id;
                    currentUserId = data.users[0].user_id;
                    loadActivities();
                }
            } catch (err) {
                select.innerHTML = `<option value="">Error: ${err.message}</option>`;
                console.error('Error loading users:', err);
                // Show error in activity list too
                document.getElementById('activityList').innerHTML = `
                    <div class="error-message">
                        <strong>Failed to load users</strong><br>
                        ${err.message}<br><br>
                        <small>URL: ${url}</small>
                    </div>
                `;
            }
        }
        
        async function loadActivities() {
            const list = document.getElementById('activityList');
            list.innerHTML = '<div class="loading">Loading activities...</div>';
            
            try {
                const response = await fetch(
                    `${API_BASE}/api/v1/logs/dashboard/activities?user_id=${currentUserId}&hours=${currentHours}&limit=100`,
                    { headers: getAuthHeaders() }
                );
                
                if (!response.ok) throw new Error('Failed to load activities');
                
                const data = await response.json();
                activities = data.activities || [];
                
                if (activities.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <p>No activities found</p>
                            <p style="color: #6e7681; font-size: 12px;">Try a longer time range</p>
                        </div>
                    `;
                    return;
                }
                
                renderActivityList();
            } catch (err) {
                list.innerHTML = `<div class="error-message">Error: ${err.message}</div>`;
                console.error('Error loading activities:', err);
            }
        }
        
        function renderActivityList() {
            const list = document.getElementById('activityList');
            list.innerHTML = activities.map((activity, index) => {
                const isSelected = activity.correlation_id === currentCorrelationId;
                const timestamp = new Date(activity.created_at).toLocaleString();
                const query = activity.metadata?.query || activity.metadata?.filename || '';
                const intent = activity.metadata?.intent;
                const intentConfidence = activity.metadata?.intent_confidence;
                const tool = activity.metadata?.tool_invoked;
                const hasError = activity.status === 'error' || activity.metadata?.error_occurred;
                const isGroqFallback = intentConfidence === 'LOW' && intent === 'CONTENT_SEARCH';
                const isPipelinePartialError = activity.metadata?.error_occurred && activity.metadata?.error_type && (activity.metadata.error_type !== 'UnknownError' && activity.metadata.error_type !== 'Error' && activity.status !== 'error');
                
                // Intent badge colors
                const intentColors = {
                    'CONTENT_SEARCH': { bg: '#1f3a5f', color: '#58a6ff', label: '🔍 Content' },
                    'TAG_BROWSE': { bg: '#2d1f4e', color: '#a371f7', label: '🏷️ Tag Browse' },
                    'COLLECTION_SUMMARY': { bg: '#1f3d2e', color: '#3fb950', label: '📊 Summary' },
                    'EXPLORATORY': { bg: '#3d2f1f', color: '#f0883e', label: '🔭 Explore' },
                    'DATE_QUERY': { bg: '#3d3a1f', color: '#d29922', label: '📅 Date' },
                    'MULTI_STEP': { bg: '#3d1f1f', color: '#f85149', label: '🔗 Multi' },
                };
                const intentInfo = intentColors[intent] || null;
                
                return `
                    <div class="activity-item ${isSelected ? 'selected' : ''}" 
                         data-index="${index}"
                         onclick="selectActivity(${index})">
                        <div class="activity-header">
                            <span class="activity-action">${formatAction(activity.action)}</span>
                            <span class="activity-status ${isPipelinePartialError ? 'warning' : hasError ? 'error' : activity.status}">${isPipelinePartialError ? '⚠ partial' : hasError ? 'error' : activity.status}</span>
                        </div>
                        ${intentInfo ? `
                        <div style="margin: 4px 0;">
                            <span style="background: ${isGroqFallback ? '#3d1f1f' : intentInfo.bg}; color: ${isGroqFallback ? '#f85149' : intentInfo.color}; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;">${isGroqFallback ? '⚠️ Fallback' : intentInfo.label}</span>
                            ${tool ? `<span style="background: #21262d; color: #8b949e; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-left: 4px;">→ ${tool}</span>` : ''}
                            ${isPipelinePartialError && !isGroqFallback ? `<span style="background: #3d2f1f; color: #f0883e; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-left: 4px;">⚠️ Errors</span>` : ''}
                        </div>
                        ` : ''}
                        <div class="activity-meta">
                            <span>🕐 ${timestamp}</span>
                            <span>⏱️ ${activity.duration_ms || 0}ms</span>
                            ${activity.resource_type ? `<span>📁 ${activity.resource_type}</span>` : ''}
                        </div>
                        ${query ? `<div class="activity-query">"${escapeHtml(query)}"</div>` : ''}
                    </div>
                `;
            }).join('');
        }
        
        function formatAction(action) {
            const icons = {
                'search': '🔍',
                'search_notes': '🔍',
                'hybrid_search': '🔍',
                'chat_search': '🤖',
                'upload': '📤',
                'upload_file': '📤',
                'upload_screenshot': '📸',
                'upload_quick_note': '📝',
                'delete': '🗑️',
                'delete_note': '🗑️',
                'create': '➕',
                'create_note': '➕',
                'update': '✏️'
            };
            const icon = icons[action] || '📋';
            return `${icon} ${action.replace(/_/g, ' ')}`;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;');
        }
        
        async function selectActivity(index) {
            currentActivity = activities[index];
            currentCorrelationId = currentActivity.correlation_id;
            
            // Update selection UI
            document.querySelectorAll('.activity-item').forEach((el, i) => {
                el.classList.toggle('selected', i === index);
            });
            
            // Show header
            document.getElementById('contentHeader').style.display = 'block';
            document.getElementById('logTabs').style.display = 'flex';
            
            // Update header info
            document.getElementById('activityTitle').textContent = formatAction(currentActivity.action);
            document.getElementById('correlationId').textContent = currentCorrelationId;
            
            // Load detailed logs
            await loadDetailedLogs();
        }
        
        async function loadDetailedLogs() {
            const container = document.getElementById('logContainer');
            container.innerHTML = '<div class="loading">Loading detailed logs...</div>';
            
            // Initialize empty logs
            currentActivity.traceLogs = null;
            currentActivity.dbLogs = null;
            currentActivity.searchTrace = null;
            currentActivity.uploadTrace = null;
            
            // Check if this is an upload activity
            const isUpload = currentActivity.action?.includes('upload') || currentActivity.trace_id;
            
            // Try to load upload trace (for upload activities)
            if (isUpload && currentActivity.trace_id) {
                try {
                    // Pass the user_id from the activity or selected user for proper filtering
                    const traceUserId = currentActivity.trace_data?.user_id || currentUserId;
                    const uploadTraceResponse = await fetch(
                        `${API_BASE}/api/v1/upload/status/${currentActivity.trace_id}?user_id=${traceUserId}`,
                        { headers: getAuthHeaders() }
                    );
                    if (uploadTraceResponse.ok) {
                        currentActivity.uploadTrace = await uploadTraceResponse.json();
                        console.log('Upload trace loaded:', currentActivity.uploadTrace);
                    }
                } catch (e) {
                    console.log('Failed to load upload trace:', e.message);
                }
            }
            
            // Try to load search trace (for search activities)
            if (currentActivity.action.includes('search')) {
                // For smart_search, use worker_request_id from metadata
                // For other searches, fall back to correlation_id
                const searchTraceId = currentActivity.metadata?.worker_request_id || currentCorrelationId;
                console.log('Looking up search trace with ID:', searchTraceId);
                
                try {
                    const traceResponse = await fetch(
                        `${API_BASE}/api/v1/logs/search-trace/${searchTraceId}`,
                        { headers: getAuthHeaders() }
                    );
                    
                    if (traceResponse.ok) {
                        currentActivity.searchTrace = await traceResponse.json();
                        console.log('Search trace loaded:', currentActivity.searchTrace);
                    } else {
                        console.log('Search trace not found for this activity');
                    }
                } catch (e) {
                    console.log('Failed to load search trace:', e.message);
                }
            }
            
            // Try to load file trace logs (may fail if logs rotated)
            try {
                const traceResponse = await fetch(
                    `${API_BASE}/api/v1/logs/file/trace/${currentCorrelationId}?include_context=true`,
                    { headers: getAuthHeaders() }
                );
                
                if (traceResponse.ok) {
                    currentActivity.traceLogs = await traceResponse.json();
                } else {
                    console.log('File trace logs not found (logs may have rotated)');
                }
            } catch (e) {
                console.log('Failed to load file trace:', e.message);
            }
            
            // Try to load operation logs from database
            try {
                const opsResponse = await fetch(
                    `${API_BASE}/api/v1/logs/trace/${currentCorrelationId}`,
                    { headers: getAuthHeaders() }
                );
                if (opsResponse.ok) {
                    currentActivity.dbLogs = await opsResponse.json();
                }
            } catch (e) {
                console.log('Failed to load DB logs:', e.message);
            }
            
            // Update summary and render (even if some logs are missing)
            updateSummary();
            renderCurrentView();
        }
        
        function updateSummary() {
            const summary = document.getElementById('activitySummary');
            const trace = currentActivity.traceLogs;
            
            const items = [
                { label: 'Duration', value: `${currentActivity.duration_ms || trace?.duration_ms || 0}ms` },
                { label: 'Log Lines', value: trace?.total_lines || 0 },
                { label: 'Status', value: currentActivity.status },
            ];
            
            if (trace?.levels_summary) {
                if (trace.levels_summary.ERROR) {
                    items.push({ label: 'Errors', value: trace.levels_summary.ERROR });
                }
                if (trace.levels_summary.WARNING) {
                    items.push({ label: 'Warnings', value: trace.levels_summary.WARNING });
                }
            }
            
            summary.innerHTML = items.map(item => `
                <div class="summary-item">
                    <div class="value">${item.value}</div>
                    <div class="label">${item.label}</div>
                </div>
            `).join('');
        }

                    break;
                case 'metadata':
                    renderMetadata(container);
                    break;
                case 'trace':
                    renderSearchTrace(container);
                    break;

                        <span style="background: #9333ea; padding: 6px 12px; border-radius: 4px; color: #fff;" title="LLM relevance verification">
                            LLM Verified: <strong>${trace.relevance_verified_count || 0}</strong>
                        </span>
                        <span style="color: #6e7681;">→</span>
                        <span style="background: #238636; padding: 6px 12px; border-radius: 4px; color: #fff;" title="${dedupInfo || 'After dedup by document'}">
                            Final: <strong>${trace.final_count || 0}</strong>
                            ${trace.dedup_removed ? `<small style="opacity:0.8;"> (-${trace.dedup_removed})</small>` : ''}
                        </span>
                    </div>
                    ${chunkGroupingInfo ? `
                    <div style="margin-top: 8px; font-size: 11px; color: #8b949e;">
                        📊 Chunk Selection: ${chunkGroupingInfo}
                    </div>
                    ` : ''}
                </div>
            `;
            
            // Vector Candidates - timestamp is embedding_started_at (when vector search begins)
            if (trace.vector_candidates?.length) {
                html += renderCandidatesTable('🎯 Vector Search Candidates', trace.vector_candidates, [
                    { key: 'title', label: 'Title' },
                    { key: 'vector_score', label: 'Vector Score', isScore: true },
                    { key: 'content', label: 'Content Preview', isPreview: true }
                ], 'worker-section', trace.search_started_at);
            }
            
            // Keyword Candidates - same timestamp as vector (parallel)
            if (trace.keyword_candidates?.length) {
                html += renderCandidatesTable('🔤 Keyword Search Candidates', trace.keyword_candidates, [
                    { key: 'note_id', label: 'Note ID' },
                    { key: 'keyword_score', label: 'Keyword Score', isScore: true }
                ], 'worker-section', trace.search_started_at);
            }
            
            // Combined Candidates
            if (trace.combined_candidates?.length) {
                html += renderCandidatesTable('🔀 Combined Candidates (Top 3 chunks/doc)', trace.combined_candidates, [
                    { key: 'title', label: 'Title' },
                    { key: 'vector_score', label: 'Vector', isScore: true },
                    { key: 'keyword_score', label: 'Keyword', isScore: true },
                    { key: 'combined_score', label: 'Combined', isScore: true }
                ], 'worker-section', trace.search_started_at);
            }
            
            // Reranked Candidates
            if (trace.reranked_candidates?.length) {
                html += renderCandidatesTable('🏆 Reranked Candidates', trace.reranked_candidates, [
                    { key: 'title', label: 'Title' },
                    { key: 'combined_score', label: 'Pre-Rerank', isScore: true },
                    { key: 'rerank_score', label: 'Rerank Score', isScore: true },
                    { key: 'passed_rerank_threshold', label: 'Passed', isBool: true }
                ], 'worker-section', trace.rerank_started_at);
            }
            
            // LLM Relevance Verification Candidates
            if (trace.relevance_verified_candidates?.length) {
                html += renderCandidatesTable('🧠 LLM Relevance Verification', trace.relevance_verified_candidates, [
                    { key: 'title', label: 'Title' },
                    { key: 'rerank_score', label: 'Rerank Score', isScore: true },
                    { key: 'passed_verification', label: 'LLM Verified', isBool: true }
                ], 'worker-section', trace.relevance_check_started_at);
            }
            
            // Final Results
            if (trace.final_results?.length) {
                html += renderCandidatesTable('✅ Final Results (After Dedup)', trace.final_results, [
                    { key: 'title', label: 'Title' },
                    { key: 'rerank_score', label: 'Rerank Score', isScore: true },
                    { key: 'similarity_score', label: 'Similarity', isScore: true }
                ], 'worker-section', trace.synthesis_started_at);
            }
            
            } // end hasPipelineData
            
            container.innerHTML = html;
        }
        
        function renderCandidatesTable(title, candidates, columns, sectionClass = '', timestamp = null) {
            // Format timestamp in IST if provided
            let timestampStr = '';
            if (timestamp) {
                try {
                    const dt = new Date(timestamp);
                    timestampStr = ` <span class="timestamp-badge">@ ${dt.toLocaleString('en-IN', { 
                        timeZone: 'Asia/Kolkata',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: true
                    })} IST</span>`;
                } catch (e) {
                    // Ignore timestamp formatting errors
                }
            }
            let html = `
                <div class="trace-section ${sectionClass}">
                    <h3>${title}${timestampStr} <span class="count">${candidates.length}</span></h3>
                    <table class="candidate-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                ${columns.map(c => `<th>${c.label}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            candidates.forEach((candidate, index) => {
                const isFiltered = candidate.passed_rerank_threshold === false || candidate.passed_verification === false;
                html += `<tr class="${isFiltered ? 'filtered' : ''}">`;
                html += `<td>${index + 1}</td>`;
                
                columns.forEach(col => {
                    const value = candidate[col.key];
                    if (col.isScore) {
                        const score = parseFloat(value) || 0;
                        const scoreClass = score >= 0.7 ? 'high' : score >= 0.4 ? 'medium' : 'low';
                        html += `<td class="score ${scoreClass}">${score.toFixed(3)}</td>`;
                    } else if (col.isBool) {
                        html += `<td>${value ? '✅' : '❌'}</td>`;
                    } else if (col.isPreview) {
                        const preview = (value || '').substring(0, 100);
                        html += `<td class="content-preview" title="${escapeHtml(value || '')}">${escapeHtml(preview)}${preview.length < (value || '').length ? '...' : ''}</td>`;
                    } else {
                        html += `<td>${escapeHtml(String(value || ''))}</td>`;
                    }
                });
                
                html += '</tr>';
            });
            
            html += `
                        </tbody>
                    </table>
                </div>
            `;
            
            return html;
        }
        
        function renderFileLogs(container) {
            const trace = currentActivity.traceLogs;
            
            if (!trace || !trace.logs || trace.logs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No file logs found for this request</p>
                        <p style="color: #6e7681; font-size: 12px;">
                            Server logs rotate frequently.<br>
                            Check the <strong>Metadata</strong> tab for activity details.
                        </p>
                        <button onclick="document.querySelector('[data-view=metadata]').click()" 
                                style="margin-top: 16px; padding: 8px 16px; background: #238636; border: none; border-radius: 6px; color: #fff; cursor: pointer;">
                            View Metadata →
                        </button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = trace.logs.map(log => `
                <div class="log-entry ${log.level}">
                    <span class="log-timestamp">${log.timestamp}</span>
                    <span class="log-level">${log.level}</span>
                    <span class="log-logger">${log.logger_name || ''}</span>
                    <span class="log-message">${escapeHtml(log.message)}</span>
                </div>
            `).join('');
        }
        
        function renderOperations(container) {
            const dbLogs = currentActivity.dbLogs;
            
            if (!dbLogs || (!dbLogs.operations?.length && !dbLogs.errors?.length)) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚙️</div>
                        <p>No operation logs found in database</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            if (dbLogs.operations?.length) {
                html += '<h3 style="color: #58a6ff; margin: 16px 0 12px;">Operations</h3>';
                dbLogs.operations.forEach(op => {
                    html += `
                        <div class="log-entry INFO">
                            <strong>${op.service}</strong> → ${op.operation}
                            <span style="color: ${op.status === 'success' ? '#3fb950' : '#f85149'}">
                                [${op.status}]
                            </span>
                            ${op.duration_ms ? `<span style="color: #8b949e">${op.duration_ms}ms</span>` : ''}
                            ${op.input_summary ? `<div class="json-viewer">${formatJson(op.input_summary)}</div>` : ''}
                            ${op.output_summary ? `<div class="json-viewer">${formatJson(op.output_summary)}</div>` : ''}
                        </div>
                    `;
                });
            }
            
            if (dbLogs.errors?.length) {
                html += '<h3 style="color: #f85149; margin: 16px 0 12px;">Errors</h3>';
                dbLogs.errors.forEach(err => {
                    html += `
                        <div class="log-entry ERROR">
                            <strong>${err.error_type || 'Error'}</strong>: ${escapeHtml(err.error_message)}
                            ${err.stack_trace ? `<pre style="margin-top: 8px; font-size: 11px; color: #8b949e;">${escapeHtml(err.stack_trace)}</pre>` : ''}
                        </div>
                    `;
                });
            }
            
            container.innerHTML = html || '<div class="empty-state"><p>No operation details available</p></div>';
        }
        
        function renderMetadata(container) {
            const activity = currentActivity;
            const metadata = activity.metadata || {};
            
            // Build a human-readable view
            let html = '<div class="detail-cards">';
            
            // Activity Overview Card
            html += `
                <div class="detail-card">
                    <h3>📋 Activity Overview</h3>
                    <div class="detail-row">
                        <span class="detail-label">Action</span>
                        <span class="detail-value">${formatAction(activity.action)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value status-${activity.status}">${activity.status}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Duration</span>
                        <span class="detail-value">${activity.duration_ms || 0} ms</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Time</span>
                        <span class="detail-value">${new Date(activity.created_at).toLocaleString()}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Correlation ID</span>
                        <span class="detail-value mono">${activity.correlation_id}</span>
                    </div>
                </div>
            `;
            
            // Search-specific details
            if (activity.action.includes('search')) {
                html += `
                    <div class="detail-card">
                        <h3>🔍 Search Details</h3>
                        ${metadata.query ? `
                        <div class="detail-row">
                            <span class="detail-label">Query</span>
                            <span class="detail-value highlight">"${escapeHtml(metadata.query)}"</span>
                        </div>
                        ` : ''}
                        <div class="detail-row">
                            <span class="detail-label">Results Found</span>
                            <span class="detail-value">${metadata.results_count ?? metadata.result_count ?? 'N/A'}</span>
                        </div>
                        ${metadata.intent ? `
                        <div class="detail-row">
                            <span class="detail-label">Intent</span>
                            <span class="detail-value" style="color: #e3b341;">${metadata.intent}</span>
                        </div>
                        ` : ''}
                        ${metadata.tool_invoked ? `
                        <div class="detail-row">
                            <span class="detail-label">Tool Invoked</span>
                            <span class="detail-value">${metadata.tool_invoked}</span>
                        </div>
                        ` : ''}
                        ${metadata.path_taken ? `
                        <div class="detail-row">
                            <span class="detail-label">Path Taken</span>
                            <span class="detail-value">${metadata.path_taken}</span>
                        </div>
                        ` : ''}
                        ${metadata.answer_generated ? `
                        <div class="detail-row">
                            <span class="detail-label">Answer Generated</span>
                            <span class="detail-value" style="color: #3fb950;">✅ Yes</span>
                        </div>
                        ` : ''}
                        ${metadata.error_occurred ? `
                        <div class="detail-row">
                            <span class="detail-label">Error</span>
                            <span class="detail-value" style="color: #f85149;">❌ ${escapeHtml(metadata.error_message || 'Unknown error')}</span>
                        </div>
                        ` : ''}
                        ${metadata.corrected_query ? `
                        <div class="detail-row">
                            <span class="detail-label">Spell Corrected</span>
                            <span class="detail-value">"${escapeHtml(metadata.corrected_query)}"</span>
                        </div>
                        ` : ''}
                    </div>
                `;
            }
            
            // Upload-specific details
            if (activity.action.includes('upload') || activity.action.includes('create')) {
                html += `
                    <div class="detail-card">
                        <h3>📤 Upload Details</h3>
                        ${metadata.filename ? `
                        <div class="detail-row">
                            <span class="detail-label">Filename</span>
                            <span class="detail-value">${escapeHtml(metadata.filename)}</span>
                        </div>
                        ` : ''}
                        ${metadata.chunks_created ? `
                        <div class="detail-row">
                            <span class="detail-label">Chunks Created</span>
                            <span class="detail-value">${metadata.chunks_created}</span>
                        </div>
                        ` : ''}
                        ${activity.resource_id ? `
                        <div class="detail-row">
                            <span class="detail-label">Resource ID</span>
                            <span class="detail-value mono">${activity.resource_id}</span>
                        </div>
                        ` : ''}
                    </div>
                `;
            }
            
            // Raw metadata
            if (Object.keys(metadata).length > 0) {
                html += `
                    <div class="detail-card">
                        <h3>📊 All Metadata</h3>
                        <div class="json-viewer">${formatJson(metadata)}</div>
                    </div>
                `;
            }
            
            html += '</div>';
            
            // Add CSS for detail cards
            container.innerHTML = `
                <style>
                    .detail-cards { display: flex; flex-direction: column; gap: 16px; }
                    .detail-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
                    .detail-card h3 { color: #58a6ff; font-size: 14px; margin-bottom: 12px; }
                    .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #21262d; }
                    .detail-row:last-child { border-bottom: none; }
                    .detail-label { color: #8b949e; font-size: 13px; }
                    .detail-value { color: #c9d1d9; font-size: 13px; font-weight: 500; }
                    .detail-value.mono { font-family: monospace; font-size: 12px; }
                    .detail-value.highlight { color: #58a6ff; }
                    .detail-value.status-success { color: #3fb950; }
                    .detail-value.status-error { color: #f85149; }
                    .detail-value.status-pending { color: #d29922; }
                </style>
                ${html}
            `;
        }
        
        function formatJson(obj) {
            if (!obj) return 'null';
            
            const json = JSON.stringify(obj, null, 2);
            return json
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:')
                .replace(/: "([^"]*)"/g, ': <span class="json-string">"$1"</span>')
                .replace(/: (\d+)/g, ': <span class="json-number">$1</span>')
                .replace(/: (true|false)/g, ': <span class="json-boolean">$1</span>')
                .replace(/: null/g, ': <span class="json-null">null</span>');
        }
    </script>
</body>
</html>
