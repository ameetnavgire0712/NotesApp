# =============================================================================
# Fly.io Configuration - Upload Service
# 
# Document processing service with Tensorlake
# - Mumbai region (bom) - same as search service
# - 2GB RAM
# - Auto-scaling 1-3 machines
# =============================================================================

app = "notesapp-upload"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile.upload"

[env]
  # Non-secret environment variables
  PYTHONUNBUFFERED = "1"
  LOG_LEVEL = "INFO"
  # Reduce HF model memory footprint
  TRANSFORMERS_CACHE = "/app/.cache/huggingface"
  HF_HOME = "/app/.cache/huggingface"
  
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0  # Dev mode: fully stop when idle
  processes = ["app"]

[[http_service.checks]]
  # Longer grace period for ML model loading
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"

# Single region - upload processing is centralized
# Latency to blob storage is more important than user proximity
[scaling]
  min_machines = 1
  max_machines = 3
