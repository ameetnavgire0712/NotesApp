# =============================================================================
# Fly.io Configuration - Search Service
# 
# Lightweight service for search endpoints
# - Primary region: iad (US-East)
# - 2GB RAM for comfortable operation
# - Auto-scaling 1-10 machines
# - Uses Cloudflare Worker for ML inference (embeddings, reranking)
# =============================================================================

app = "notesapp-search"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.search"

[env]
  # Non-secret environment variables
  PYTHONUNBUFFERED = "1"
  LOG_LEVEL = "INFO"
  
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0  # Dev mode: fully stop when idle
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"
  
# Multi-region deployment
# Fly automatically routes to closest region
[regions]
  primary = "iad"
  backup = ["fra", "sin"]

# Auto-scaling configuration
[scaling]
  min_machines = 2
  max_machines = 10
